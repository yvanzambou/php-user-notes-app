ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Versteckte Dateien (.env, .git, .htaccess …) nie ausliefern
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

<Directory /var/www/html/public>
    Options -Indexes -MultiViews
    AllowOverride None
    Require all granted
</Directory>
